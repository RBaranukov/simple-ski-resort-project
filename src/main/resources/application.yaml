server:
  servlet:
    context-path: /ski-resort

spring:
  liquibase:
    enabled: true
    change-log: db/changelog/db.changelog-master.xml
  datasource:
    username: postgres
    password: password
    url: jdbc:postgresql://localhost:5432/postgres
    driver-class-name: org.postgresql.Driver
  cache:
    cache-names: user
    caffeine:
      spec: initialCapacity=100,maximumSize=500,expireAfterAccess=9h,recordStats
